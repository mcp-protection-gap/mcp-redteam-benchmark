[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cym500"
version = "0.1.0"
description = "MCP red-team corpus and security-scanner benchmark"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "tenacity>=8.2",
    "rich>=13.7",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "regex>=2024.4.16",
    "tldextract>=5.1",
    "detect-secrets>=1.5",
    "docker>=7.0",
    "anyio>=4.3",
    "structlog>=24.1",
    "orjson>=3.10",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
]
notebooks = [
    "jupyterlab>=4.1",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.scripts]
cym500 = "cym500.__main__:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
